apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  labels: {app: sre-agent}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: sre-agent}
  template:
    metadata:
      labels:
        app: sre-agent
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SRE_PROVIDER, value: {{ .Values.provider | quote }}}
            - {name: SRE_CLUSTER_TYPE, value: "incluster"}
            - {name: SRE_ALLOWED_NAMESPACES, value: {{ .Values.allowedNamespaces | quote }}}
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent
spec:
  type: {{ .Values.service.type }}
  selector: {app: sre-agent}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
