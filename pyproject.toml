[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agent"
version = "0.1.0"
description = "Read-only multi-cloud AI SRE investigation agent for Kubernetes (Bedrock Nova + Azure OpenAI)"
requires-python = ">=3.11"
dependencies = [
  "kubernetes>=29.0.0",
  "boto3>=1.34.0",
  "openai>=1.40.0",
  "azure-identity>=1.16.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0",
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5.0", "httpx>=0.27"]

[project.scripts]
sre-agent = "sre_agent.cli:main"
sre-eval = "sre_agent.evaluation.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
